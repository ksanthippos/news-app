<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Taustagradientti -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Päävärin liukuväri (uutiskortin otsikkopalkki) -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Tähtikorostus / apuri-hehku -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Varjot -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Tausta (Moderni pyöristetty sovellusikoni) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Uutislehti / kortti -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="88" width="312" height="336" rx="32" fill="#ffffff" />
    
    <!-- Uutislehden yläpalkki (brand-väri) -->
    <path d="M100 120 C100 102 114 88 132 88 L380 88 C398 88 412 102 412 120 L412 168 L100 168 Z" fill="url(#brand)" />
    
    <!-- Masthead-viivat yläpalkissa -->
    <rect x="136" y="118" width="130" height="14" rx="7" fill="#ffffff" fill-opacity="0.95" />
    <circle cx="372" cy="125" r="7" fill="#ffffff" fill-opacity="0.9" />

    <!-- Uutisen pääotsikko -->
    <rect x="136" y="200" width="240" height="20" rx="10" fill="#1e293b" />
    <rect x="136" y="232" width="160" height="16" rx="8" fill="#334155" />

    <!-- Uutiskuva-paikkamerkki / väliosa -->
    <rect x="136" y="268" width="240" height="52" rx="14" fill="#f1f5f9" />
    <rect x="156" y="286" width="60" height="16" rx="8" fill="#cbd5e1" />

    <!-- Tekstirivit -->
    <rect x="136" y="342" width="240" height="12" rx="6" fill="#94a3b8" />
    <rect x="136" y="364" width="200" height="12" rx="6" fill="#94a3b8" />
    <rect x="136" y="386" width="130" height="12" rx="6" fill="#cbd5e1" />
  </g>

  <!-- Apuri / Suosikki -tähti leijumassa kortin yläkulmassa -->
  <g filter="url(#starShadow)">
    <circle cx="376" cy="136" r="34" fill="url(#accent)" />
    <path d="M376 117 L381.2 128.5 L393.8 130.1 L384.5 138.8 L386.9 151.3 L376 145.2 L365.1 151.3 L367.5 138.8 L358.2 130.1 L370.8 128.5 Z" fill="#ffffff" />
  </g>
</svg>
